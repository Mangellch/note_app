{% extends "base.html" %}
{% block title %}Recuperar Contraseña{% endblock %}
{% block content %}

<div class="flex items-center justify-center min-h-screen bg-pink-100">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h2 class="text-3xl font-bold text-center text-fuchsia-700 mb-6">¿Olvidaste tu contraseña? 💌</h2>
    <p class="text-center text-sm text-gray-600 mb-4">
      Ingresa tu correo y te enviaremos un enlace para restablecerla.
    </p>

    <form method="POST" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-fuchsia-700 mb-1">Correo electrónico</label>
        <input type="email" name="email" id="email" required
               class="w-full border border-fuchsia-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-fuchsia-400">
      </div>

      <button type="submit"
              class="w-full bg-fuchsia-600 hover:bg-fuchsia-700 text-white font-semibold py-2 rounded transition">
        Enviar enlace de recuperación
      </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-4">
      <a href="{{ url_for('auth.login') }}" class="text-fuchsia-600 hover:underline">← Volver al inicio de sesión</a>
    </p>
  </div>
</div>

{% endblock %}
