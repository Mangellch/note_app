{% extends "base.html" %}
{% block title %}Crear Nota{% endblock %}
{% block content %}

<h2 class="text-2xl font-bold mb-6 text-primary">Crear nueva nota</h2>

<form method="POST" class="max-w-md mx-auto bg-white p-6 shadow-md rounded-lg space-y-4">
  <div>
    <label for="title" class="block mb-1 font-medium">Título</label>
    <input  id="title" name="title" type="text" required
            class="w-full border border-secondary/50 rounded px-3 py-2 focus:outline-none
                   focus:ring-2 focus:ring-secondary">
  </div>

  <div>
    <label for="content" class="block mb-1 font-medium">Contenido</label>
    <textarea id="content" name="content" rows="4" required
              class="w-full border border-secondary/50 rounded px-3 py-2 focus:outline-none
                     focus:ring-2 focus:ring-secondary"></textarea>
  </div>

  <button type="submit"
          class="w-full bg-primary hover:bg-darkPurple text-white py-2 rounded-lg">
    💾 Crear Nota
  </button>
</form>
{% endblock %}
