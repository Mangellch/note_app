<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas</title>
</head>
<body>
    <h1>Crear nueva nota</h1>
    <form method="POST">

    <label for="nota">Título</label>
    <input type="text" id="title" name="title" value = "{{note.title}}">
    <br>
    <label for="content">Contenido</label>
    <input type="text" id="content" name="content" value = "{{note.value}}">

    <input type="submit" value="Guardar Nota">
</form>

</body>
</html>
