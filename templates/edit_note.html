{% extends "base.html" %}
{% block title %}Editar Nota{% endblock %}
{% block content %}

<h2 class="text-2xl font-bold mb-6 text-primary">Editar nota</h2>

<form method="POST"
      class="max-w-md mx-auto bg-white p-6 shadow-md rounded-lg space-y-4">
  <div>
    <label for="title" class="block mb-1 font-medium">Título</label>
    <input id="title" name="title" type="text" required
           value="{{ note.title }}"
           class="w-full border border-secondary/50 rounded px-3 py-2
                  focus:outline-none focus:ring-2 focus:ring-secondary">
  </div>

  <div>
    <label for="content" class="block mb-1 font-medium">Contenido</label>
    <textarea id="content" name="content" rows="4" required
              class="w-full border border-secondary/50 rounded px-3 py-2
                     focus:outline-none focus:ring-2 focus:ring-secondary">{{ note.content }}</textarea>
  </div>

  <button type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg">
    💾 Guardar Cambios
  </button>
</form>

{# --- Botón/Enlace “Volver” --- #}
<a href="{{ url_for('notes.home') }}"
   class="block max-w-md mx-auto mt-4 text-center bg-darkPurple hover:bg-primary
          text-white font-medium py-2 rounded-lg transition">
  ⬅️ Volver
</a>
{% endblock %}
